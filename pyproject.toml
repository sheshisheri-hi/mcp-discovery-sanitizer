[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "mcp-discovery-sanitizer"
version = "0.1.0"
description = "CPU-only gate for MCP discovery payloads: bound instructions, refuse public cache from untrusted servers, hash for audit."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Sheshi Sheri" }]
keywords = ["mcp", "security", "prompt-injection", "cache-poisoning"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Security",
]
dependencies = []

[project.optional-dependencies]
dev = ["pytest==8.3.5"]

[project.scripts]
mcp-discovery-sanitizer = "mcp_discovery_sanitizer.cli:main"

[project.urls]
Repository = "https://github.com/sheshisheri-hi/mcp-discovery-sanitizer"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
pythonpath = ["src"]
